<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a0a0a"/>

  <!-- Scissors blades -->
  <!-- Blade 1: top-left to bottom-right -->
  <line x1="8" y1="8" x2="24" y2="24" stroke="#c9a96e" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade 2: bottom-left to top-right -->
  <line x1="8" y1="24" x2="24" y2="8" stroke="#c9a96e" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Pivot screw at center -->
  <circle cx="16" cy="16" r="1.8" fill="#c9a96e"/>

  <!-- Handle rings — top-left -->
  <circle cx="8.5" cy="8.5" r="3.2" stroke="#c9a96e" stroke-width="1.8" fill="none"/>
  <!-- Handle rings — bottom-left -->
  <circle cx="8.5" cy="23.5" r="3.2" stroke="#c9a96e" stroke-width="1.8" fill="none"/>
</svg>
