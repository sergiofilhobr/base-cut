<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo -->
  <circle cx="16" cy="16" r="16" fill="#0a0a0a"/>

  <!-- Cabo: haste fina do pino até o cotovelo -->
  <line
    x1="6.6" y1="15.4" x2="12" y2="20.4"
    stroke="#fafafa" stroke-width="1.9" stroke-linecap="round"
  />

  <!-- Pino do pivô -->
  <circle cx="6.6" cy="15.4" r="1.6" fill="#fafafa"/>

  <!-- Lâmina: aberta em diagonal, pontas retas -->
  <polygon
    points="11.26,19.03 24.70,8.35 27.30,11.65 13.74,22.17"
    fill="#fafafa" stroke="#fafafa" stroke-width="1.2" stroke-linejoin="round"
  />
</svg>
