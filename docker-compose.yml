services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: basecut
      POSTGRES_PASSWORD: basecut
      POSTGRES_DB: basecut
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basecut -d basecut"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://basecut:basecut@postgres:5432/basecut
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  pgdata:
