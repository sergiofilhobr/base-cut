name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: basecut
          POSTGRES_PASSWORD: basecut
          POSTGRES_DB: basecut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basecut -d basecut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Testar e subir a API
        run: |
          set -euo pipefail
          if [ ! -f backend/package.json ]; then
            echo "Esta branch ainda não tem backend/."
            exit 0
          fi
          cd backend
          npm ci
          npx tsc --noEmit
          npm test
          if [ -f Dockerfile ]; then
            docker build -t basecut-api .
          fi
          DATABASE_URL=postgres://basecut:basecut@localhost:5432/basecut PORT=4000 \
            npx tsx src/main.ts > /tmp/api.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health; then
              echo
              kill "$pid" || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build do site
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -euo pipefail
          if [ -f frontend/package.json ]; then
            cd frontend
          fi
          npm ci
          npm run build

  deploy:
    name: Deploy
    needs: [api, site]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Publicar o site na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Faltam VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID nos segredos do repositório."
            echo "main publica em basecut.com.br. develop publica só em base-cut-navy.vercel.app."
            exit 1
          fi
          root="."
          if [ -f frontend/package.json ]; then
            root="frontend"
          fi
          npm install -g vercel@62.7.0
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd "$root"
            vercel build --prod --token="$VERCEL_TOKEN" --cwd "$root"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd "$root" --archive=tgz --yes
          else
            # develop atualiza só base-cut-navy.vercel.app, com o ambiente de preview.
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --cwd "$root"
            vercel build --token="$VERCEL_TOKEN" --cwd "$root"
            deployment=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --cwd "$root" --archive=tgz --yes | tail -n 1)
            echo "Deployment: ${deployment}"
            host=${deployment#https://}
            host=${host#http://}
            host=${host%%/*}
            vercel alias set "$host" base-cut-navy.vercel.app --token="$VERCEL_TOKEN" --cwd "$root" --yes
          fi

  api-deploy:
    name: Deploy da API
    needs: [api]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar flyctl
        run: |
          set -euo pipefail
          version=0.4.113
          arquivo="flyctl_${version}_Linux_x86_64.tar.gz"
          curl -fsSL -o "/tmp/${arquivo}" "https://github.com/superfly/flyctl/releases/download/v${version}/${arquivo}"
          echo "8b0a0056857f4f42ba35e4aa7fa8ed715f925fdf2e710a84676210fe7e0d9859  /tmp/${arquivo}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -C "$HOME/.local/bin" -xzf "/tmp/${arquivo}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publicar o processo na Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Falta FLY_API_TOKEN."
            echo "main publica em basecut-api. develop publica em basecut-api-staging."
            exit 1
          fi
          # O contexto é backend/: o Dockerfile copia package-lock.json, src/ e sql/ dali.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            flyctl deploy ./backend --remote-only --config ../fly.toml --app basecut-api
          else
            flyctl deploy ./backend --remote-only --config ../fly.staging.toml --app basecut-api-staging
          fi
