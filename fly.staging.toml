# develop. Banco Neon Free, sem dados de produção.
app = "basecut-api-staging"
primary_region = "gru"

# O deploy usa o diretório backend/ como contexto. O Dockerfile copia a partir daí.
[build]
  dockerfile = "Dockerfile"

# O teste gratuito da Fly cobra as horas em que a máquina está ligada
# (2 horas no total). Ela acorda no primeiro pedido e para quando ociosa.
# O lembrete de horário só sai enquanto ela está acordada. Produção, em
# fly.toml, continua ligada.
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "4000"
  NODE_ENV = "production"
