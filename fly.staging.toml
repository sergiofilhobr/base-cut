# develop. Banco Neon Free, sem dados de produção.
app = "basecut-api-staging"
primary_region = "gru"

# O deploy usa o diretório backend/ como contexto. O Dockerfile copia a partir daí.
[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "4000"
  NODE_ENV = "production"
