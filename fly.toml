# Produção. develop usa fly.staging.toml.
app = "basecut-api"
primary_region = "gru"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "4000"
  NODE_ENV = "production"
